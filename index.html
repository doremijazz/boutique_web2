<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
        <link rel="stylesheet" href="style.css"/>
        <script type="module" src="catalogue.js"></script>
        <!-- Script de gestion du panier -->
        <script type="module" src="cart.js"></script>
    </head>
    <body>
        <header class="banniere">
            <div class="panier_btn">
                <button id="cart-button" type="button">Panier </button>
                <img src="images/logo_caddie.png">
            </div>
            <h1>
                <img src="images/logo_sac.png">
                <p>NovaShop</p>
            </h1>
            <!-- Bouton permettant d'ouvrir le panier -->
            
        </header>
        <main>
            <section class="promos">
                <div>
                    <h3> BIENVENU SUR NOVASHOP</h3>
                    <h2>Découvrez vos nouveau favoris.</h2>
                    <p>Une selection de produit pour votre quotidien</p>
                    <button class="btn-voir-tout">Voir les produit →</button>
                </div>
                <img src="images/sac_bleu.png">

            </section>
            <section class="filtre">
				<h3>Nos produit</h3>
				<button class="btn-informatique btn-filtre">Informatique</button>
				<br>
				<button class="btn-vetement btn-filtre">Vétements</button>
				<br>
				<button class="btn-maison btn-filtre">Maison</button>
                <br>
                <button class="btn-beauté btn-filtre">Beauté</button>
                <br>
                <button class="btn-sport btn-filtre">Sport</button>
			</section>
            <section class="trie">
                <label for="tri">Trier par :</label>
                <select id="tri">
                    <option value="defaut">Par défaut</option>
                    <option value="croissant">Prix croissant</option>
                    <option value="decroissant">Prix décroissant</option>
                </select>
            </section>
            <section class="fiches">

            </section>

            <!-- Section contenant le panier -->
            <section id="cart-section" hidden>
                <div class="cart-header">
                    <h2>Mon panier</h2>
                    <button id="close-cart" type="button">×</button>
                </div>

                <!-- Liste des articles présents dans le panier -->
                <div id="cart-items"></div>

                <div class="cart-footer">
                    <p>Total : <span id="cart-total">0,00</span> €</p>
                    <button id="order-button" type="button">Passer la commande</button>
                </div>
            </section>

        </main>
        <footer>

        </footer>
    </body>
</html>
