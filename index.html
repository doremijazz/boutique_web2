<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
        <link rel="stylesheet" href="style.css"/>
        <script type="module" src="catalogue.js"></script>
        <!-- Script de gestion du panier -->
        <script type="module" src="cart.js"></script>
    </head>
    <body>
        <header class="banniere">
            <h1>
                STORE
            </h1>
            <!-- Bouton permettant d'ouvrir le panier -->
            <button id="cart-button" type="button">Panier</button>
        </header>
        <main>
            <section class="filtre">
				<h3>Filtrer</h3>
				<button class="btn-informatique">Informatique</button>
				<br>
				<button class="btn-vetement">Vétements</button>
				<br>
				<button class="btn-maison">Maison</button>
                <br>
                <button class="btn-beauté">Beauté</button>
                <br>
                <button class="btn_sport">Sport</button>
			</section>
            <section class="trie">
                <h3>Trier</h3>
                <button class="btn-trier-croissant">Prix croissant</button>
				<br>
                <button class="btn-trier-decroissant">Prix croissant</button>
            </section>
            <section class="fiches">

            </section>

            <!-- Section contenant le panier -->
            <section id="cart-section" hidden>
                <div class="cart-header">
                    <h2>Mon panier</h2>
                    <button id="close-cart" type="button">×</button>
                </div>

                <!-- Liste des articles présents dans le panier -->
                <div id="cart-items"></div>

                <div class="cart-footer">
                    <p>Total : <span id="cart-total">0,00</span> €</p>
                    <button id="order-button" type="button">Passer la commande</button>
                </div>
            </section>

        </main>
        <footer>

        </footer>
    </body>
</html>
